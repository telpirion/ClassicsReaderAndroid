apply plugin: 'com.android.application'

android {
    namespace("com.ericmschmidt.latinreader")
    compileSdk(36)
    dataBinding {
        enabled = true
    }
    defaultConfig {
        applicationId("com.ericmschmidt.latinreader")
        minSdkVersion(24)
        targetSdkVersion(36)
        versionCode(15)
        versionName("1.8.0")

    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    //compileOptions {
    //    sourceCompatibility = JavaVersion.VERSION_24 // Or your desired Java version
    //    targetCompatibility = JavaVersion.VERSION_24 // Or your desired Java version
    //}
}

dependencies {
    implementation project(':compose')
    implementation project(':core')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
